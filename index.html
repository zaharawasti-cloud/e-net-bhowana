
<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-NET Bhowana | High Speed Fiber Internet</title>
    
    <!-- Scripts: React, Babel, Tailwind, Lucide, Framer Motion -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: black; color: white; margin: 0; }
        .success-box { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Icons Helper
        const Icon = ({ name, className }) => {
            const [icon, setIcon] = useState(null);
            useEffect(() => {
                const iconElement = lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const PACKAGES = [
            { speed: '3 Mbps', price: '1000', label: 'Starter' },
            { speed: '4 Mbps', price: '1200', label: 'Basic' },
            { speed: '5 Mbps', price: '1500', label: 'Economy' },
            { speed: '10 Mbps', price: '2200', label: 'Standard' },
            { speed: '15 Mbps', price: '2700', label: 'Pro' },
            { speed: '20 Mbps', price: '3200', label: 'Plus' },
            { speed: '25 Mbps', price: '4500', label: 'Ultra' },
            { speed: '30 Mbps', price: '5500', label: 'Premium' },
        ];

        function App() {
            const [userID, setUserID] = useState('');
            const [billResult, setBillResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [complaintName, setComplaintName] = useState('');
            const [complaintMsg, setComplaintMsg] = useState('');

            useEffect(() => {
                lucide.createIcons();
            }, [billResult, loading, error]);

            const checkBill = async () => {
                if (!userID.trim()) {
                    setError('Meharbani karke User ID darj karein.');
                    return;
                }
                setLoading(true);
                setError('');
                setBillResult(null);

                const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzRq5ZxOyKHJdgk27yxAljxKInairoZ4ZTLc73RCMr8Aq26m2vhcbKzoZN2xrsVLE8oMdtuVKTQhs1/pub?output=csv";

                try {
                    const response = await fetch(sheetURL, { cache: 'no-store' });
                    if (!response.ok) throw new Error('Sheet access error');
                    const data = await response.text();
                    const rows = data.split(/\r?\n/).filter(row => row.trim() !== '');
                    let found = false;

                    // Header Detection
                    let idIdx = 0, nameIdx = 1, billIdx = 2;
                    if (rows.length > 0) {
                        const firstRow = rows[0].split(',').map(c => c.replace(/^"|"$/g, '').trim().toLowerCase());
                        const idH = firstRow.findIndex(h => h.includes('id') || h.includes('user'));
                        const nameH = firstRow.findIndex(h => h.includes('name') || h.includes('customer'));
                        const billH = firstRow.findIndex(h => h.includes('bill') || h.includes('total'));
                        if (idH !== -1) idIdx = idH;
                        if (nameH !== -1) nameIdx = nameH;
                        if (billH !== -1) billIdx = billH;
                    }

                    for (let i = 0; i < rows.length; i++) {
                        const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                        if (i === 0 && cols[idIdx].toLowerCase().includes('id')) continue;

                        if (cols[idIdx] === userID.trim()) {
                            setBillResult({ id: cols[idIdx], name: cols[nameIdx] || 'Customer', amount: cols[billIdx] || '0' });
                            found = true;
                            break;
                        }
                    }
                    if (!found) setError(`Maazrat! ID "${userID}" ka record nahi mila.`);
                } catch (e) {
                    setError('Network Error! Google Sheet se raabta nahi ho saka.');
                } finally {
                    setLoading(false);
                }
            };

            const handleWhatsApp = () => {
                if (!complaintName || !complaintMsg) { alert("Pora form bharein."); return; }
                const phone = "923467749237";
                const text = `*--- E-NET NEW COMPLAINT ---*\n\n*Name:* ${complaintName}\n*Message:* ${complaintMsg}`;
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, "_blank");
            };

            return (
                <div className="min-h-screen bg-black text-white font-sans">
                    {/* Navigation */}
                    <nav className="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/10 px-4 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-blue-600 rounded-lg"><Icon name="wifi" className="w-5 h-5" /></div>
                                <div className="flex flex-col">
                                    <span className="text-lg font-black tracking-tighter italic leading-none">E-NET</span>
                                    <span className="text-[10px] font-bold text-blue-500 tracking-[0.2em] uppercase">Bhowana</span>
                                </div>
                            </div>
                            <div className="hidden md:flex space-x-8 text-sm font-medium">
                                <a href="#bill" className="hover:text-blue-500">Check Bill</a>
                                <a href="#packages" className="hover:text-blue-500">Packages</a>
                                <a href="#complaint" className="hover:text-blue-500">Complaint</a>
                            </div>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section className="text-center py-24 px-4 overflow-hidden">
                        <div className="max-w-5xl mx-auto relative">
                            <div className="inline-block p-4 bg-blue-600 rounded-3xl mb-8 relative">
                                <Icon name="wifi" className="w-12 h-12 text-white" />
                            </div>
                            <h1 className="text-6xl md:text-8xl font-black mb-6 tracking-tighter">
                                <span className="block italic">E-NET</span>
                                <span className="block text-blue-600 text-4xl md:text-6xl tracking-normal">BHOWANA</span>
                            </h1>
                            <p className="text-gray-400 text-lg max-w-2xl mx-auto mb-10">Premium High Speed Fiber Internet Service Provider in Bhowana.</p>
                            <div className="flex justify-center gap-4">
                                <a href="#bill" className="bg-blue-600 px-8 py-3 rounded-xl font-bold hover:bg-blue-700">Check Bill</a>
                                <a href="#packages" className="bg-white/5 px-8 py-3 rounded-xl font-bold border border-white/10">Packages</a>
                            </div>
                        </div>
                    </section>

                    {/* Bill Section */}
                    <section id="bill" className="py-20 px-4 max-w-3xl mx-auto">
                        <div className="bg-zinc-900 border border-white/10 rounded-[32px] p-8">
                            <h2 className="text-2xl font-bold mb-6 text-center">Check Your Monthly Bill</h2>
                            <div className="flex flex-col md:flex-row gap-4 mb-6">
                                <input 
                                    className="flex-1 bg-black border border-white/10 rounded-2xl p-4 outline-none focus:border-blue-600"
                                    placeholder="Enter User ID (e.g. 1)"
                                    value={userID}
                                    onChange={(e) => setUserID(e.target.value)}
                                />
                                <button onClick={checkBill} className="bg-blue-600 px-8 py-4 rounded-2xl font-bold">{loading ? 'Loading...' : 'Get Details'}</button>
                            </div>
                            {error && <div className="text-red-500 bg-red-500/10 p-4 rounded-xl text-center">{error}</div>}
                            {billResult && (
                                <div className="bg-green-500/5 border border-green-500/20 p-8 rounded-3xl">
                                    <div className="flex justify-between border-b border-white/5 pb-4 mb-4">
                                        <span className="text-gray-500">Customer</span>
                                        <span className="font-bold">{billResult.name}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-xl font-bold">Total Bill</span>
                                        <span className="text-4xl font-black text-green-500">Rs. {billResult.amount}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Packages */}
                    <section id="packages" className="py-24 px-4 bg-zinc-950">
                        <div className="max-w-7xl mx-auto">
                            <h2 className="text-3xl font-bold text-center mb-12">Internet Packages</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {PACKAGES.map((pkg, i) => (
                                    <div key={i} className="bg-zinc-900 border border-white/5 p-8 rounded-3xl hover:border-blue-600/50 transition-all">
                                        <span className="text-[10px] font-bold text-blue-500 bg-blue-500/10 px-2 py-1 rounded-full uppercase mb-4 inline-block">{pkg.label}</span>
                                        <h3 className="text-3xl font-black mb-1">{pkg.speed}</h3>
                                        <p className="text-zinc-500 text-xs mb-6 italic">Unlimited Fiber Data</p>
                                        <div className="text-2xl font-black border-t border-white/5 pt-4">Rs. {pkg.price}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Complaint Form */}
                    <section id="complaint" className="py-24 px-4 max-w-7xl mx-auto grid lg:grid-cols-2 gap-12">
                        <div>
                            <h2 className="text-3xl font-bold mb-6">Contact Us</h2>
                            <div className="space-y-4">
                                <div className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl">
                                    <Icon name="phone" className="text-blue-500" />
                                    <span>0341-7625739</span>
                                </div>
                                <div className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl">
                                    <Icon name="message-square" className="text-blue-500" />
                                    <span>0346-7749237 (WhatsApp)</span>
                                </div>
                                <div className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl">
                                    <Icon name="map-pin" className="text-blue-500" />
                                    <span>Upper Floor Sharif Medicare, Bhawana</span>
                                </div>
                            </div>
                        </div>
                        <div className="bg-zinc-900 p-8 rounded-[32px] border border-white/10">
                            <h3 className="text-xl font-bold mb-6">Register A Complaint</h3>
                            <input className="w-full bg-black border border-white/10 rounded-xl p-4 mb-4" placeholder="Your Name" value={complaintName} onChange={e=>setComplaintName(e.target.value)} />
                            <textarea className="w-full bg-black border border-white/10 rounded-xl p-4 mb-4 h-32" placeholder="Message..." value={complaintMsg} onChange={e=>setComplaintMsg(e.target.value)}></textarea>
                            <button onClick={handleWhatsApp} className="w-full bg-green-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2">
                                <Icon name="message-square" /> Send via WhatsApp
                            </button>
                        </div>
                    </section>

                    <footer className="py-12 border-t border-white/10 text-center text-zinc-600 text-sm">
                        © 2026 E-NET Bhowana Internet Services. All Rights Reserved.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
