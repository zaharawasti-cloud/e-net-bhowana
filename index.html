<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-NET Bhowana</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; background:#000; color:white; text-align:center; }
        header { background:#0a0a0a; padding:20px; border-bottom:2px solid blue; }
        header h1 { color:blue; margin:0; }
        section { padding:40px; }
        input { width:80%; max-width:300px; padding:12px; margin:10px; border-radius:5px; border:none; background:#222; color:white; }
        button { background:blue; color:white; border:none; padding:12px 25px; cursor:pointer; border-radius:5px; font-weight:bold; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>

<header><h1>E-NET Bhowana</h1></header>

<section>
    <h2>Check Your Bill</h2>
    <input type="text" id="userID" placeholder="Enter User ID (e.g. 1)">
    <br><button onclick="checkBill()">Check Bill Now</button>
    <div id="result"></div>
</section>

<script>
async function checkBill() {
    const userID = document.getElementById("userID").value.trim();
    const resultDiv = document.getElementById("result");
    if(!userID) { resultDiv.innerHTML = "ID likhein!"; return; }
    
    resultDiv.innerHTML = "Searching...";

    // New more reliable Link format
    const sheetURL = "https://google.com";

    try {
        const response = await fetch(sheetURL);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.text();
        const rows = data.split('\n');
        let found = false;

        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(',').map(c => c.replace(/"/g, '').trim());
            if (cols[0] === userID) {
                resultDiv.innerHTML = `
                <div style="border:2px solid blue; padding:20px; border-radius:10px; background:#111; display:inline-block; text-align:left;">
                    <p><b>Name:</b> ${cols[1]}</p>
                    <p><b>NID:</b> ${cols[2]}</p>
                    <p style="font-size:20px; color:lime;"><b>Bill: Rs. ${cols[4] || '1500'}</b></p>
                </div>`;
                found = true; break;
            }
        }
        if (!found) resultDiv.innerHTML = "<span style='color:red;'>User ID nahi mili!</span>";
    } catch (e) { 
        resultDiv.innerHTML = "<span style='color:red;'>Connection Error! Laptop ka internet check karein.</span>";
    }
}
</script>
</body>
</html>
